<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KiteTutor – pokój lekcyjny</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#120E2B;color:#FFFFFF;font-family:Nunito,system-ui,sans-serif}
a{color:#C9BCFF}a:hover{color:#FFFFFF}
*{box-sizing:border-box}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;margin:0}
.ctl{width:56px;height:56px;border-radius:18px;border:0;background:#2A2350;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ctl:hover{background:#3A3168}
.ctlOff{background:#FFFFFF;color:#B42318}
.end{height:56px;padding:0 22px;border-radius:18px;border:0;background:#E5484D;color:#FFFFFF;font-weight:800;font-size:16px;display:flex;align-items:center;text-decoration:none}
.end:hover{background:#C93B40;color:#FFFFFF}
.tab{min-height:44px;padding:0 14px;border-radius:12px;border:0;background:transparent;color:#C9BCFF;font-weight:800;font-family:inherit;font-size:15px;cursor:pointer}
.tabOn{background:#2A2350;color:#FFFFFF}
.pill{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px}
</style>
<style>.preview-bar{background:#1C1640;color:#FFFFFF;text-align:center;font:700 14px/1.4 Nunito,system-ui,sans-serif;padding:8px 16px}.preview-bar a{color:#FFC93C}</style>
<script>
function page() { return {
 state: { mic: true, cam: true, tab: 'board' },
 setState(o) { Object.assign(this.state, o); },
 get v() {
const s = this.state;
const T = [['board', 'Tablica'], ['chat', 'Czat'], ['files', 'Materiały'], ['notes', 'Notatki']];
return {
micCls: s.mic ? 'ctl' : 'ctl ctlOff', camCls: s.cam ? 'ctl' : 'ctl ctlOff',
micOff: !s.mic, camOn: s.cam, camOff: !s.cam,
micAria: s.mic ? 'Wycisz mikrofon' : 'Włącz mikrofon', camAria: s.cam ? 'Wyłącz kamerę' : 'Włącz kamerę',
micPressed: s.mic ? 'false' : 'true', camPressed: s.cam ? 'false' : 'true',
micLabel: s.mic ? '' : ' · wyciszony', selfBg: s.cam ? '#2E5E6E' : '#2A2350',
toggleMic: () => this.setState({ mic: !s.mic }), toggleCam: () => this.setState({ cam: !s.cam }),
tabs: T.map((t) => ({ name: t[1], cls: s.tab === t[0] ? 'tab tabOn' : 'tab', pick: () => this.setState({ tab: t[0] }) })),
tBoard: s.tab === 'board', tChat: s.tab === 'chat', tFiles: s.tab === 'files', tNotes: s.tab === 'notes'
};
}
}; }
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body x-data="page()">
<div class="preview-bar">Podgląd portalu KiteTutor – wersja demonstracyjna. Dane, ceny i profile są przykładowe. <a href="index.html">Start</a></div>
<div style="min-height: 960px; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px 20px; border-bottom: 1px solid #2A2350">
<a href="uczen.html" style="text-decoration: none; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 22px"><span style="color: #A996FF">kite</span><span style="color: #FF7A7E">tutor</span></a>
<div style="font-weight: 800">Matematyka · Funkcja kwadratowa – zadania maturalne</div>
<span class="pill" style="background: #1F4D3E; color: #8FF0C9">● Na żywo 32:14 / 60:00</span>
<span class="pill" style="background: #2A2350; color: #E2D9FF">Nagrywanie wyłączone</span>
<span class="pill" style="background: #2A2350; color: #E2D9FF; margin-left: auto">Połączenie: bardzo dobre</span>
</header>
<div style="flex: 1; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px 20px">
<main style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="position: relative; border-radius: 22px; overflow: hidden; background: #3B3268; aspect-ratio: 16 / 9; display: flex; align-items: flex-end; justify-content: center">
<svg width="56%" viewBox="0 0 200 150" aria-hidden="true"><circle cx="100" cy="58" r="32" fill="#F2C29B"></circle><path d="M68 48 Q100 10 132 48 Q128 28 100 24 Q72 28 68 48Z" fill="#3A2318"></path><path d="M28 150 Q28 98 100 98 Q172 98 172 150Z" fill="#5B3BE8"></path></svg>
<span class="pill" style="position: absolute; left: 14px; bottom: 14px; background: rgba(0,0,0,0.6); color: #FFFFFF">Marta K. · mówi</span>
<span aria-hidden="true" style="position: absolute; left: 14px; top: 14px; display: flex; gap: 3px; align-items: flex-end; height: 22px"><span style="width: 4px; height: 10px; background: #8FF0C9; border-radius: 2px"></span><span style="width: 4px; height: 20px; background: #8FF0C9; border-radius: 2px"></span><span style="width: 4px; height: 14px; background: #8FF0C9; border-radius: 2px"></span><span style="width: 4px; height: 8px; background: #8FF0C9; border-radius: 2px"></span></span>
<div :style="'position: absolute; right: 14px; bottom: 14px; width: 26%; min-width: 150px; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; border: 3px solid #120E2B; background: ' + (v.selfBg) + '; display: flex; align-items: flex-end; justify-content: center'">
<template x-if="v.camOn"><div style="display: contents"><svg width="70%" viewBox="0 0 200 150" aria-hidden="true"><circle cx="100" cy="60" r="30" fill="#C98E62"></circle><path d="M70 54 Q74 24 100 24 Q126 24 130 54 Q118 38 100 40 Q82 38 70 54Z" fill="#1E1410"></path><path d="M36 150 Q36 100 100 100 Q164 100 164 150Z" fill="#2EE6A6"></path></svg></div></template>
<template x-if="v.camOff"><div style="display: contents"><div style="align-self: center; font-weight: 800; color: #C9BCFF">Kamera wyłączona</div></div></template>
<span class="pill" style="position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,0.6); color: #FFFFFF">Ty<span x-text="v.micLabel"></span></span>
</div>
</div>
<nav aria-label="Sterowanie lekcją" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center">
<button type="button" :class="v.micCls" @click="v.toggleMic()" :aria-label="v.micAria" :aria-pressed="v.micPressed"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path><path x-show="v.micOff" d="M3 3l18 18"></path></svg></button>
<button type="button" :class="v.camCls" @click="v.toggleCam()" :aria-label="v.camAria" :aria-pressed="v.camPressed"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3"></path><path x-show="v.camOff" d="M3 3l18 18"></path></svg></button>
<button type="button" class="ctl" aria-label="Udostępnij ekran"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4M12 13V7M9 10l3-3 3 3"></path></svg></button>
<button type="button" class="ctl" aria-label="Podnieś rękę"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V5a1.5 1.5 0 0 1 3 0v6M11 10V3.5a1.5 1.5 0 0 1 3 0V10M14 10V5a1.5 1.5 0 0 1 3 0v8a7 7 0 0 1-7 7 6 6 0 0 1-5-3l-2-4a1.5 1.5 0 0 1 2.6-1.4L8 14"></path></svg></button>
<button type="button" class="ctl" aria-label="Ustawienia dźwięku i obrazu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.6 15H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9.7 4.6V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.3z"></path></svg></button>
<a class="end" href="uczen.html">Zakończ lekcję</a>
</nav>
</main>
<aside style="flex: 1 1 360px; min-width: 0; background: #1C1640; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 12px" aria-label="Narzędzia lekcji">
<div style="display: flex; gap: 4px; flex-wrap: wrap"><template x-for="t in v.tabs"><div style="display: contents"><button type="button" :class="t.cls" @click="t.pick()"><span x-text="t.name"></span></button></div></template></div>
<template x-if="v.tBoard"><div style="display: contents"><div style="background: #FFFFFF; color: #1C1640; border-radius: 16px; padding: 14px; flex: 1"><div style="font-weight: 800; margin-bottom: 6px">Tablica wspólna</div><svg width="100%" viewBox="0 0 320 220" role="img" aria-label="Wykres paraboli z zaznaczonym wierzchołkiem"><line x1="20" y1="180" x2="300" y2="180" stroke="#8F89A6" stroke-width="1.5"></line><line x1="160" y1="20" x2="160" y2="210" stroke="#8F89A6" stroke-width="1.5"></line><path d="M60 40 Q160 300 260 40" fill="none" stroke="#5B3BE8" stroke-width="4"></path><circle cx="160" cy="170" r="6" fill="#E5484D"></circle><text x="172" y="166" font-size="15" font-weight="800" fill="#E5484D">W(p, q)</text><text x="24" y="34" font-size="15" font-weight="800" fill="#1C1640">f(x) = x² − 4x + 3</text><text x="24" y="58" font-size="14" fill="#4B4566">p = −b/2a = 2</text></svg></div></div></template>
<template x-if="v.tChat"><div style="display: contents"><div style="display: flex; flex-direction: column; gap: 10px; flex: 1"><div style="align-self: flex-start; background: #2A2350; padding: 10px 14px; border-radius: 14px 14px 14px 4px; max-width: 85%">Spróbuj teraz zadanie 8 sama, a ja patrzę na tablicę.</div><div style="align-self: flex-end; background: #5B3BE8; padding: 10px 14px; border-radius: 14px 14px 4px 14px; max-width: 85%">Delta wychodzi mi 0, czyli jedno miejsce zerowe?</div><label for="msg" style="position: absolute; left: -9999px">Wiadomość</label><input id="msg" type="text" placeholder="Napisz wiadomość…" style="margin-top: auto; min-height: 48px; border-radius: 14px; border: 0; padding: 0 14px; font-family: inherit; font-size: 15px"></div></div></template>
<template x-if="v.tFiles"><div style="display: contents"><div style="display: flex; flex-direction: column; gap: 8px; flex: 1"><div style="background: #2A2350; padding: 12px 14px; border-radius: 14px; font-weight: 800">Arkusz maturalny – funkcje.pdf</div><div style="background: #2A2350; padding: 12px 14px; border-radius: 14px; font-weight: 800">Wzory – funkcja kwadratowa.png</div><div style="color: #C9BCFF; font-size: 14px">Korepetytorka udostępnia pliki w trakcie lekcji. Zostają w Twoich materiałach.</div></div></div></template>
<template x-if="v.tNotes"><div style="display: contents"><div style="flex: 1; display: flex; flex-direction: column; gap: 8px"><label for="ln" style="font-weight: 800">Moje notatki z lekcji</label><textarea id="ln" rows="9" style="border-radius: 14px; border: 0; padding: 12px; font-family: inherit; font-size: 15px; line-height: 1.5">Δ = 0 → jedno miejsce zerowe, x = p.</textarea></div></div></template>
</aside>
</div>
</div>
</body>
</html>
