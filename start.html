<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KiteTutor – kto się uczy</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F3FF;color:#1C1640;font-family:Nunito,system-ui,sans-serif}
a{color:#4A2DD0}a:hover{color:#1C1640}
*{box-sizing:border-box}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.card{background:#FFFFFF;border-radius:20px;padding:24px;border:1px solid #ECE7FF}
.opt{background:#FFFFFF;border-radius:20px;padding:22px;border:2px solid #ECE7FF;text-align:left;font-family:inherit;color:#1C1640;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:44px}
.opt:hover{border-color:#B8A6FF}
.optOn{border-color:#5B3BE8;background:#F6F2FF}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:14px;background:#5B3BE8;color:#FFFFFF;font-weight:800;text-decoration:none;font-size:16px}
.btn:hover{background:#4A2DD0;color:#FFFFFF}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#EFE9FF;color:#4A2DD0;font-weight:800;font-size:13px}
.muted{color:#5E5878}
.tog{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:#F6F3FF;font-weight:700;cursor:pointer}
.tog input{width:22px;height:22px;accent-color:#5B3BE8}
</style>
<style>.preview-bar{background:#1C1640;color:#FFFFFF;text-align:center;font:700 14px/1.4 Nunito,system-ui,sans-serif;padding:8px 16px}.preview-bar a{color:#FFC93C}</style>
<script>
function page() { return {
 state: { who: 'me' },
 setState(o) { Object.assign(this.state, o); },
 get v() {
const w = this.state.who;
const on = (k) => (w === k ? 'opt optOn' : 'opt');
return {
optMe: on('me'), optChild: on('child'), optTutor: on('tutor'),
isMe: w === 'me', isChild: w === 'child', isTutor: w === 'tutor',
pickMe: () => this.setState({ who: 'me' }),
pickChild: () => this.setState({ who: 'child' }),
pickTutor: () => this.setState({ who: 'tutor' })
};
}
}; }
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body x-data="page()">
<div class="preview-bar">Podgląd portalu KiteTutor – wersja demonstracyjna. Dane, ceny i profile są przykładowe. <a href="index.html">Start</a></div>
<div style="min-height: 1000px; padding-top: 32px; padding-bottom: 48px">
<div class="wrap" style="display: flex; flex-direction: column; gap: 24px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 24px"><span style="color: #5B3BE8">kite</span><span style="color: #E8424A; margin-left: -10px">tutor</span></a>
<div style="display: flex; gap: 8px; align-items: center"><span class="chip">Krok 1 z 3</span><span class="muted" style="font-weight: 700">Konto</span></div>
<h1 style="font-size: 44px">Kto będzie się uczyć?</h1>
<p class="muted" style="margin: 0; font-size: 18px">Od tego zależy, jakie widoki dostaniesz. Możesz to później zmienić w ustawieniach.</p>
<div style="display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr))">
<button type="button" :class="v.optMe" @click="v.pickMe()"><span class="chip">Mam 18 lat lub więcej</span><span style="font-family: Fredoka, sans-serif; font-size: 22px; font-weight: 600">Ja – uczę się dla siebie</span><span class="muted">Dostajesz panel ucznia. Widok opiekuna jest opcjonalny.</span></button>
<button type="button" :class="v.optChild" @click="v.pickChild()"><span class="chip">Uczeń poniżej 18 lat</span><span style="font-family: Fredoka, sans-serif; font-size: 22px; font-weight: 600">Moje dziecko</span><span class="muted">Zakładasz konto rodzica, a dziecko dostaje konto ucznia pod Twoją opieką.</span></button>
<button type="button" :class="v.optTutor" @click="v.pickTutor()"><span class="chip">Uczę innych</span><span style="font-family: Fredoka, sans-serif; font-size: 22px; font-weight: 600">Jestem korepetytorem</span><span class="muted">Profil, kalendarz, materiały i wypłaty. Przechodzisz weryfikację.</span></button>
</div>

<template x-if="v.isMe"><div style="display: contents">
<div class="card" style="display: flex; flex-direction: column; gap: 14px">
<h2 style="font-size: 24px">Twoje konto ucznia</h2>
<label class="tog"><input type="checkbox"><span>Dodaj opiekuna, który widzi moje postępy (opcjonalnie, np. pracodawca finansujący kurs)</span></label>
<p class="muted" style="margin: 0">Płacisz sam. Opiekun widzi tylko postępy i raporty, nigdy wiadomości z korepetytorem.</p>
<a class="btn" href="szukaj.html" style="align-self: flex-start">Dalej – wybierz przedmiot</a>
</div>
</div></template>
<template x-if="v.isChild"><div style="display: contents">
<div class="card" style="display: flex; flex-direction: column; gap: 14px">
<h2 style="font-size: 24px">Konto rodzica i konto dziecka</h2>
<div style="display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr))">
<div style="padding: 16px; border-radius: 14px; background: #F6F3FF"><div style="font-weight: 800">Ty widzisz</div><div class="muted" style="margin-top: 6px; line-height: 1.5">Postępy, raporty po lekcjach, płatności, faktury, album dziecka. Zatwierdzasz rezerwacje.</div></div>
<div style="padding: 16px; border-radius: 14px; background: #F6F3FF"><div style="font-weight: 800">Dziecko widzi</div><div class="muted" style="margin-top: 6px; line-height: 1.5">Lekcje, materiały, notatki, zadania i album. Bez płatności i bez kontaktu z obcymi.</div></div>
<div style="padding: 16px; border-radius: 14px; background: #E6FBF3"><div style="font-weight: 800; color: #11775A">Ochrona małoletnich</div><div style="margin-top: 6px; line-height: 1.5; color: #1C4A3C">Imię, zdjęcie i szkoła dziecka nie są widoczne w wyszukiwarce. Korepetytor kontaktuje się z Tobą.</div></div>
</div>
<a class="btn" href="rodzic.html" style="align-self: flex-start">Dalej – dodaj dziecko</a>
</div>
</div></template>
<template x-if="v.isTutor"><div style="display: contents">
<div class="card" style="display: flex; flex-direction: column; gap: 14px">
<h2 style="font-size: 24px">Weryfikacja korepetytora</h2>
<ol style="margin: 0; padding-left: 22px; line-height: 1.9" class="muted"><li>Potwierdzenie tożsamości</li><li>Kwalifikacje i doświadczenie</li><li>Sprawdzenie w rejestrach wymaganych przy pracy z dziećmi (jeśli chcesz uczyć małoletnich)</li><li>Krótka lekcja próbna z naszym zespołem</li><li>Konto do wypłat</li></ol>
<a class="btn" href="korepetytor.html" style="align-self: flex-start">Dalej – utwórz profil</a>
</div>
</div></template>
</div>
</div>
</body>
</html>
